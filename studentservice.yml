spring:
  application:
    name: StudentService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/student_db
    username: root
    password: admin1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 1111
info:
  app:
    name: Student Management Service
    description: Student CRUD Microservice
    version: 1.0.0
management:
  info:
    env:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
